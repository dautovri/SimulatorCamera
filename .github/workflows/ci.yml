name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (app + extension + CLI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Code signing is disabled on CI: the container app and the bundled
      # CMIOExtension are signed only for release builds, where the
      # Developer ID cert is available. This job verifies the code compiles
      # and the extension embeds correctly.
      - name: Build SimulatorCamera (app + embedded extension)
        run: |
          xcodebuild -project SimulatorCamera.xcodeproj \
                     -scheme SimulatorCamera \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Build simcamctl
        run: |
          xcodebuild -project SimulatorCamera.xcodeproj \
                     -scheme simcamctl \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Run contract tests
        run: |
          xcodebuild -project SimulatorCamera.xcodeproj \
                     -scheme SimulatorCamera \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     test

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict || true   # non-blocking until a config is committed
